        .leaf:nth-child(4) { animation-delay: 0.3s; }
        .leaf:nth-child(5) { animation-delay: 0.3s; }

        @keyframes fade {
        0% { opacity: 0; }
        100% { opacity: 0.3; }
        }
    </style>

